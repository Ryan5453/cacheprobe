[project]
name = "cacheprobe"
version = "1.0.0.dev1"
description = "Auditing Prompt Cache Isolation in Gateway APIs"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.7.1",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.scripts]
cacheprobe = "cacheprobe.cli:main"
cacheprobe-graphs = "cacheprobe.graphs:main"